<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">One response advantage, repeated across its tokens</title><desc id="desc">Outcome supervision; prepared arithmetic example, no trained model</desc><rect width="1200" height="620" fill="#f5f5f0"/><g font-family="Arial, sans-serif" fill="#1d2935"><text x="50" y="57" font-size="33" font-weight="bold">One response advantage, repeated across its tokens</text><text x="50" y="93" font-size="21">Outcome supervision; prepared arithmetic example, no trained model</text><rect x="45" y="135" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="165" font-size="24" font-weight="bold">A: r = 0</text><text x="285" y="165" font-size="22">2 positions: [-0.866025, -0.866025]</text><text x="285" y="194" font-size="18" fill="#465963">Group rewards [0, 0, 1, 1], mean = 0.5</text><rect x="45" y="226" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="256" font-size="24" font-weight="bold">B: r = 0</text><text x="285" y="256" font-size="22">4 positions: same -0.866025 at every position</text><text x="285" y="285" font-size="18" fill="#465963">Sample standard deviation = sqrt(1/3) = 0.577350</text><rect x="45" y="317" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="347" font-size="24" font-weight="bold">C: r = 1</text><text x="285" y="347" font-size="22">6 positions: same +0.866025 at every position</text><text x="285" y="376" font-size="18" fill="#465963">A_i = (r_i - mean) / std; population std instead gives +/-1</text><rect x="45" y="408" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="438" font-size="24" font-weight="bold">D: r = 1</text><text x="285" y="438" font-size="22">8 positions: same +0.866025 at every position</text><text x="285" y="467" font-size="18" fill="#465963">Token probabilities and gradients can still differ</text><rect x="45" y="499" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="529" font-size="24" font-weight="bold">All equal</text><text x="285" y="529" font-size="22">[1, 1, 1, 1] -&gt; zero relative advantages</text><text x="285" y="558" font-size="18" fill="#465963">Safe zero-variance handling in this teaching example</text></g></svg>