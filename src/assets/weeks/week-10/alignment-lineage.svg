<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Alignment methods: a teaching lineage</title><desc id="desc">Different supervision choices, not a mandatory deployment sequence</desc><rect width="1200" height="620" fill="#f5f5f0"/><g font-family="Arial, sans-serif" fill="#1d2935"><text x="50" y="57" font-size="33" font-weight="bold">Alignment methods: a teaching lineage</text><text x="50" y="93" font-size="21">Different supervision choices, not a mandatory deployment sequence</text><rect x="45" y="135" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="165" font-size="24" font-weight="bold">SFT</text><text x="285" y="165" font-size="22">Demonstration -&gt; next-token likelihood</text><text x="285" y="194" font-size="18" fill="#465963">Learns the supplied answer; no sampled reward optimization</text><rect x="45" y="226" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="256" font-size="24" font-weight="bold">RLHF / PPO</text><text x="285" y="256" font-size="22">Preferences -&gt; reward model -&gt; sampled responses</text><text x="285" y="285" font-size="18" fill="#465963">Policy + reference + reward + value function (critic)</text><rect x="45" y="317" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="347" font-size="24" font-weight="bold">DPO</text><text x="285" y="347" font-size="22">Preferred / rejected pair -&gt; direct policy objective</text><text x="285" y="376" font-size="18" fill="#465963">Fixed-pair setup: no separate reward-model training or rollout loop</text><rect x="45" y="408" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="438" font-size="24" font-weight="bold">GRPO</text><text x="285" y="438" font-size="22">Group of responses -&gt; rewards -&gt; relative advantage</text><text x="285" y="467" font-size="18" fill="#465963">Removes the learned critic; retains a source of reward</text><rect x="45" y="499" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="529" font-size="24" font-weight="bold">Counterexample</text><text x="285" y="529" font-size="22">Base policy -&gt; RL directly: R1-Zero</text><text x="285" y="558" font-size="18" fill="#465963">SFT is common, but is not a prerequisite for every RL pipeline</text></g></svg>