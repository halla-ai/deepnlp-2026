<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Three objectives, one hypothetical question</title><desc id="desc">Different supplied signals yield different losses; no model training</desc><rect width="1200" height="530" fill="#f5f5f0"/><g font-family="Arial,sans-serif" fill="#1d2935"><text x="50" y="55" font-size="32" font-weight="bold">Three objectives, one hypothetical question</text><text x="50" y="92" font-size="21">U: unverified assurance. V: verify official opening information first.</text><rect x="45" y="128" width="1110" height="82" rx="8" fill="#fff" stroke="#bac4c6"/><text x="65" y="158" font-size="23" font-weight="bold">SFT: copy V</text><text x="325" y="158" font-size="21">p(target tokens) = [0.50, 0.25, 0.80]</text><text x="325" y="190" font-size="18">mean(-ln p) = 0.767528; no direct comparison with U</text><rect x="45" y="222" width="1110" height="82" rx="8" fill="#fff" stroke="#bac4c6"/><text x="65" y="252" font-size="23" font-weight="bold">Preference: V &gt; U</text><text x="325" y="252" font-size="21">reward gap = r(V) - r(U) = 2</text><text x="325" y="284" font-size="18">sigmoid(2) = 0.880797; label loss = 0.126928</text><rect x="45" y="316" width="1110" height="82" rx="8" fill="#fff" stroke="#bac4c6"/><text x="65" y="346" font-size="23" font-weight="bold">DPO: policy vs ref</text><text x="325" y="346" font-size="21">ln(0.20/0.10) - ln(0.10/0.20) = 1.386294</text><text x="325" y="378" font-size="18">beta = 0.5 -&gt; margin = 0.693147 -&gt; loss = 0.405465</text><rect x="45" y="410" width="1110" height="82" rx="8" fill="#fff" stroke="#bac4c6"/><text x="65" y="440" font-size="23" font-weight="bold">Different targets</text><text x="325" y="440" font-size="21">Target token / preference label / policy log-ratio</text><text x="325" y="472" font-size="18">Provided arithmetic, not measured model training</text></g></svg>