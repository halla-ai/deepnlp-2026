<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Reward and critic answer different questions</title><desc id="desc">Conceptual language-model RL pipeline; not an exact architecture count</desc><rect width="1200" height="620" fill="#f5f5f0"/><g font-family="Arial, sans-serif" fill="#1d2935"><text x="50" y="57" font-size="33" font-weight="bold">Reward and critic answer different questions</text><text x="50" y="93" font-size="21">Conceptual language-model RL pipeline; not an exact architecture count</text><rect x="45" y="135" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="165" font-size="24" font-weight="bold">Policy</text><text x="285" y="165" font-size="22">Prompt -&gt; sampled response</text><text x="285" y="194" font-size="18" fill="#465963">Produces the action sequence</text><rect x="45" y="226" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="256" font-size="24" font-weight="bold">Reward</text><text x="285" y="256" font-size="22">Completed response -&gt; quality score</text><text x="285" y="285" font-size="18" fill="#465963">Human-preference reward model or rule-based verifier</text><rect x="45" y="317" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="347" font-size="24" font-weight="bold">Critic / PPO</text><text x="285" y="347" font-size="22">Prefix state -&gt; expected return V(s)</text><text x="285" y="376" font-size="18" fill="#465963">Helps form a baseline; not the source of the quality criterion</text><rect x="45" y="408" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="438" font-size="24" font-weight="bold">GRPO baseline</text><text x="285" y="438" font-size="22">Same prompt, several responses -&gt; group statistics</text><text x="285" y="467" font-size="18" fill="#465963">Mean / standard deviation replace a learned value baseline</text><rect x="45" y="499" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="529" font-size="24" font-weight="bold">Reference</text><text x="285" y="529" font-size="22">Policy distribution -&gt; divergence constraint</text><text x="285" y="558" font-size="18" fill="#465963">Separate from old policy used in the probability ratio</text></g></svg>