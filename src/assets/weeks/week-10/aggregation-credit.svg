<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Aggregation is not causal token attribution</title><desc id="desc">Two responses with lengths 2 and 8; weights before token loss values</desc><rect width="1200" height="620" fill="#f5f5f0"/><g font-family="Arial, sans-serif" fill="#1d2935"><text x="50" y="57" font-size="33" font-weight="bold">Aggregation is not causal token attribution</text><text x="50" y="93" font-size="21">Two responses with lengths 2 and 8; weights before token loss values</text><rect x="45" y="135" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="165" font-size="24" font-weight="bold">Response mean</text><text x="285" y="165" font-size="22">Short: 1/4 per token; long: 1/16 per token</text><text x="285" y="194" font-size="18" fill="#465963">Each response totals 1/2 of the batch weight</text><rect x="45" y="226" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="256" font-size="24" font-weight="bold">Token mean</text><text x="285" y="256" font-size="22">Short: 1/10 per token; long: 1/10 per token</text><text x="285" y="285" font-size="18" fill="#465963">Response weights become 2/10 and 8/10</text><rect x="45" y="317" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="347" font-size="24" font-weight="bold">What changes</text><text x="285" y="347" font-size="22">The denominator and the weighting of lengths</text><text x="285" y="376" font-size="18" fill="#465963">Advantage need not become different at each token</text><rect x="45" y="408" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="438" font-size="24" font-weight="bold">What is missing</text><text x="285" y="438" font-size="22">Which step actually caused success or failure?</text><text x="285" y="467" font-size="18" fill="#465963">That requires a separate credit-assignment signal</text><rect x="45" y="499" width="1110" height="77" rx="9" fill="#ffffff" stroke="#bac4c6"/><text x="65" y="529" font-size="24" font-weight="bold">Scope</text><text x="285" y="529" font-size="22">DAPO Section 3.3 explains token-level aggregation</text><text x="285" y="558" font-size="18" fill="#465963">Full DAPO also changes clipping, sampling and length handling</text></g></svg>