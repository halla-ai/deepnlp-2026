<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">PRM의 두 사용처: 선택 vs 학습</title>
<desc id="desc">이번 실습은 교수 제공 점수의 재순위 산술 관찰. 모델·RL 학습 없음.</desc>
<rect width="1200" height="540" fill="#f7f6f2" />
<g font-family="sans-serif" fill="#20262e">
<text x="48" y="60" font-size="30" font-weight="700">PRM의 두 사용처: 선택 vs 학습</text>
<rect x="48" y="100" width="350" height="138" rx="12" fill="#e3edf2" stroke="#93aab7" />
<text x="68" y="144" font-size="24" font-weight="700">후보 생성</text>
<text x="68" y="191" font-size="18">같은 질문에 N개 응답</text>
<rect x="422" y="100" width="350" height="138" rx="12" fill="#e3edf2" stroke="#93aab7" />
<text x="442" y="144" font-size="24" font-weight="700">단계 평가</text>
<text x="442" y="191" font-size="18">단계 점수와 집계</text>
<rect x="796" y="100" width="350" height="138" rx="12" fill="#e3edf2" stroke="#93aab7" />
<text x="816" y="144" font-size="24" font-weight="700">용도 선택</text>
<text x="816" y="191" font-size="18">추론 재순위 또는 RL 신호</text>
<rect x="48" y="282" width="1100" height="72" rx="10" fill="#e4eee3" />
<text x="70" y="325" font-size="23" font-weight="700">추론 경로</text>
<text x="350" y="325" font-size="22">최고 점수 후보 선택, 파라미터 갱신 없음</text>
<rect x="48" y="372" width="1100" height="72" rx="10" fill="#f1e5d6" />
<text x="70" y="415" font-size="23" font-weight="700">학습 경로</text>
<text x="350" y="415" font-size="22">advantage·목적함수 -&gt; 파라미터 갱신</text>
<text x="48" y="503" font-size="17">이번 실습은 교수 제공 점수의 재순위 산술 관찰. 모델·RL 학습 없음.</text>
</g></svg>
