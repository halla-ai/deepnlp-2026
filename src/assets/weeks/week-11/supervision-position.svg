<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">감독 위치: 결과 하나 vs 중간 단계</title>
<desc id="desc">감독 위치의 차이. ORM도 전체 풀이를 입력으로 받을 수 있음.</desc>
<rect width="1200" height="540" fill="#f7f6f2" />
<g font-family="sans-serif" fill="#20262e">
<text x="48" y="60" font-size="30" font-weight="700">감독 위치: 결과 하나 vs 중간 단계</text>
<rect x="48" y="100" width="350" height="138" rx="12" fill="#e3edf2" stroke="#93aab7" />
<text x="68" y="144" font-size="24" font-weight="700">단계 1</text>
<text x="68" y="191" font-size="18">공개 근거 읽기</text>
<rect x="422" y="100" width="350" height="138" rx="12" fill="#e3edf2" stroke="#93aab7" />
<text x="442" y="144" font-size="24" font-weight="700">단계 2</text>
<text x="442" y="191" font-size="18">범주와 명칭 연결</text>
<rect x="796" y="100" width="350" height="138" rx="12" fill="#e3edf2" stroke="#93aab7" />
<text x="816" y="144" font-size="24" font-weight="700">단계 3</text>
<text x="816" y="191" font-size="18">최종 답 작성</text>
<rect x="48" y="282" width="1100" height="72" rx="10" fill="#e4eee3" />
<text x="70" y="325" font-size="23" font-weight="700">ORM</text>
<text x="350" y="325" font-size="22">결과 라벨 하나: 정답 여부</text>
<rect x="48" y="372" width="1100" height="72" rx="10" fill="#f1e5d6" />
<text x="70" y="415" font-size="23" font-weight="700">PRM</text>
<text x="350" y="415" font-size="22">단계별 라벨: 타당 / 오류 / 모호</text>
<text x="48" y="503" font-size="17">감독 위치의 차이. ORM도 전체 풀이를 입력으로 받을 수 있음.</text>
</g></svg>
