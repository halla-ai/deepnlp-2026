<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img">
<title>그래프 확장: 연결도 근거가 필요</title>
<rect width="1200" height="360" fill="#f3f5f7"/>
<text x="45" y="60" font-family="sans-serif" font-size="30" fill="#172b3a">그래프 확장: 연결도 근거가 필요</text>
<rect x="40" y="115" width="215" height="150" rx="12" fill="white" stroke="#397b8b" stroke-width="2"/>
<text x="58" y="164" font-family="sans-serif" font-size="23" fill="#172b3a">문서 A</text>
<text x="58" y="204" font-family="sans-serif" font-size="16" fill="#335d6b">개체 X의 설명</text>
<text x="256" y="196" font-family="sans-serif" font-size="24" fill="#397b8b">→</text>
<rect x="275" y="115" width="215" height="150" rx="12" fill="white" stroke="#397b8b" stroke-width="2"/>
<text x="293" y="164" font-family="sans-serif" font-size="23" fill="#172b3a">개체 X</text>
<text x="293" y="204" font-family="sans-serif" font-size="16" fill="#335d6b">동일 개체 판정</text>
<text x="491" y="196" font-family="sans-serif" font-size="24" fill="#397b8b">→</text>
<rect x="510" y="115" width="215" height="150" rx="12" fill="white" stroke="#397b8b" stroke-width="2"/>
<text x="528" y="164" font-family="sans-serif" font-size="23" fill="#172b3a">관계 X → Y</text>
<text x="528" y="204" font-family="sans-serif" font-size="16" fill="#335d6b">관계 출처 확인</text>
<text x="726" y="196" font-family="sans-serif" font-size="24" fill="#397b8b">→</text>
<rect x="745" y="115" width="215" height="150" rx="12" fill="white" stroke="#397b8b" stroke-width="2"/>
<text x="763" y="164" font-family="sans-serif" font-size="23" fill="#172b3a">문서 B</text>
<text x="763" y="204" font-family="sans-serif" font-size="16" fill="#335d6b">개체 Y의 설명</text>
<text x="961" y="196" font-family="sans-serif" font-size="24" fill="#397b8b">→</text>
<rect x="980" y="115" width="215" height="150" rx="12" fill="white" stroke="#397b8b" stroke-width="2"/>
<text x="998" y="164" font-family="sans-serif" font-size="23" fill="#172b3a">확장 결과</text>
<text x="998" y="204" font-family="sans-serif" font-size="16" fill="#335d6b">질문 조건 재확인</text>
<text x="45" y="318" font-family="sans-serif" font-size="18" fill="#335d6b">교육용 개념도. 측정 결과나 실제 제주 데이터의 관계를 표시한 그림이 아님.</text>
</svg>