<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img">
<title>데모 상태와 공개할 근거</title>
<rect width="1200" height="390" rx="18" fill="#f4f1e9"/>
<text x="48" y="65" font-family="sans-serif" font-size="32" font-weight="700" fill="#182d38">데모 상태와 공개할 근거</text>
<rect x="40" y="110" width="260" height="165" rx="12" fill="#dce7e4" stroke="#84928f"/>
<text x="58" y="154" font-family="sans-serif" font-size="23" font-weight="700" fill="#182d38">정상 실행</text>
<text x="58" y="210" font-family="sans-serif" font-size="18" fill="#253f49">현재 입력·출력 기록</text>
<path d="M 306 187 h 16 m -6 -6 l 6 6 l -6 6" stroke="#182d38" stroke-width="3" fill="none"/>
<rect x="330" y="110" width="260" height="165" rx="12" fill="#e8ddca" stroke="#84928f"/>
<text x="348" y="154" font-family="sans-serif" font-size="23" font-weight="700" fill="#182d38">현장 실패</text>
<text x="348" y="210" font-family="sans-serif" font-size="18" fill="#253f49">실패 공개·안전한 중단</text>
<path d="M 596 187 h 16 m -6 -6 l 6 6 l -6 6" stroke="#182d38" stroke-width="3" fill="none"/>
<rect x="620" y="110" width="260" height="165" rx="12" fill="#dce4ee" stroke="#84928f"/>
<text x="638" y="154" font-family="sans-serif" font-size="23" font-weight="700" fill="#182d38">과거 기록</text>
<text x="638" y="210" font-family="sans-serif" font-size="18" fill="#253f49">시점·코드 판·차이 표시</text>
<path d="M 886 187 h 16 m -6 -6 l 6 6 l -6 6" stroke="#182d38" stroke-width="3" fill="none"/>
<rect x="910" y="110" width="260" height="165" rx="12" fill="#e4dfeb" stroke="#84928f"/>
<text x="928" y="154" font-family="sans-serif" font-size="23" font-weight="700" fill="#182d38">근거 없음</text>
<text x="928" y="210" font-family="sans-serif" font-size="18" fill="#253f49">판단 보류·재실행 계획</text>
<text x="48" y="335" font-family="sans-serif" font-size="20" fill="#253f49">과거 기록은 과거 실행의 증거. 현재 성공으로 표현하지 않는 구분.</text>
</svg>
