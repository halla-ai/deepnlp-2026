<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
<title>변화와 측정 실패의 분리</title>
<rect width="1200" height="500" fill="#f5f3ed"/>
<text x="48" y="64" font-family="sans-serif" font-size="30" fill="#183d42">변화와 측정 실패의 분리</text>
<rect x="40" y="115" width="270" height="275" rx="14" fill="#ffffff" stroke="#aac4bf"/>
<rect x="40" y="115" width="270" height="12" fill="#23857c"/>
<text x="58" y="175" font-family="sans-serif" font-size="25" fill="#183d42">입력 이동</text>
<text x="58" y="238" font-family="sans-serif" font-size="20" fill="#183d42">질의 표현 변경</text>
<text x="58" y="295" font-family="sans-serif" font-size="16" fill="#183d42">행정시 없는 질문 → 보류</text>
<rect x="330" y="115" width="270" height="275" rx="14" fill="#ffffff" stroke="#aac4bf"/>
<rect x="330" y="115" width="270" height="12" fill="#23857c"/>
<text x="348" y="175" font-family="sans-serif" font-size="25" fill="#183d42">prompt 갱신</text>
<text x="348" y="238" font-family="sans-serif" font-size="20" fill="#183d42">출력 계약 변경</text>
<text x="348" y="295" font-family="sans-serif" font-size="16" fill="#183d42">이름만 반환 → count 누락</text>
<rect x="620" y="115" width="270" height="275" rx="14" fill="#ffffff" stroke="#aac4bf"/>
<rect x="620" y="115" width="270" height="12" fill="#23857c"/>
<text x="638" y="175" font-family="sans-serif" font-size="25" fill="#183d42">model 갱신</text>
<text x="638" y="238" font-family="sans-serif" font-size="20" fill="#183d42">계산 규칙 변경</text>
<text x="638" y="295" font-family="sans-serif" font-size="16" fill="#183d42">두 이름 + count 3 → 오답</text>
<rect x="910" y="115" width="270" height="275" rx="14" fill="#ffffff" stroke="#aac4bf"/>
<rect x="910" y="115" width="270" height="12" fill="#23857c"/>
<text x="928" y="175" font-family="sans-serif" font-size="25" fill="#183d42">지표 노후화</text>
<text x="928" y="238" font-family="sans-serif" font-size="20" fill="#183d42">채점 대상 불일치</text>
<text x="928" y="295" font-family="sans-serif" font-size="16" fill="#183d42">이름 포함 2/3, count 0/3</text>
<text x="48" y="455" font-family="sans-serif" font-size="18" fill="#496568">교수 작성 규칙형 실험. 실제 LM 성능·현장 멘토 의견 아님.</text></svg>
