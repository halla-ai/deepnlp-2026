<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
<title>Q2: 결과를 누가 받는가</title>
<rect width="1200" height="500" fill="#f5f3ed"/>
<text x="48" y="64" font-family="sans-serif" font-size="30" fill="#183d42">Q2: 결과를 누가 받는가</text>
<rect x="40" y="115" width="270" height="275" rx="14" fill="#ffffff" stroke="#aac4bf"/>
<rect x="40" y="115" width="270" height="12" fill="#23857c"/>
<text x="58" y="175" font-family="sans-serif" font-size="25" fill="#183d42">읽는 사람</text>
<text x="58" y="238" font-family="sans-serif" font-size="20" fill="#183d42">출처 / 오답 영향</text>
<text x="58" y="295" font-family="sans-serif" font-size="16" fill="#183d42">내용을 확인할 수 있는지</text>
<rect x="330" y="115" width="270" height="275" rx="14" fill="#ffffff" stroke="#aac4bf"/>
<rect x="330" y="115" width="270" height="12" fill="#23857c"/>
<text x="348" y="175" font-family="sans-serif" font-size="25" fill="#183d42">받는 프로그램</text>
<text x="348" y="238" font-family="sans-serif" font-size="20" fill="#183d42">count / schema</text>
<text x="348" y="295" font-family="sans-serif" font-size="16" fill="#183d42">누락값을 집계하지 않는지</text>
<rect x="620" y="115" width="270" height="275" rx="14" fill="#ffffff" stroke="#aac4bf"/>
<rect x="620" y="115" width="270" height="12" fill="#23857c"/>
<text x="638" y="175" font-family="sans-serif" font-size="25" fill="#183d42">운영 담당자</text>
<text x="638" y="238" font-family="sans-serif" font-size="20" fill="#183d42">버전 / 재현 묶음</text>
<text x="638" y="295" font-family="sans-serif" font-size="16" fill="#183d42">어느 변경부터 되돌릴지</text>
<rect x="910" y="115" width="270" height="275" rx="14" fill="#ffffff" stroke="#aac4bf"/>
<rect x="910" y="115" width="270" height="12" fill="#23857c"/>
<text x="928" y="175" font-family="sans-serif" font-size="25" fill="#183d42">멘토 리뷰</text>
<text x="928" y="238" font-family="sans-serif" font-size="20" fill="#183d42">개발 / 운영 / 소통</text>
<text x="928" y="295" font-family="sans-serif" font-size="16" fill="#183d42">역할별 우선순위 검토</text>
<text x="48" y="455" font-family="sans-serif" font-size="18" fill="#496568">교수 작성 규칙형 실험. 실제 LM 성능·현장 멘토 의견 아님.</text></svg>
