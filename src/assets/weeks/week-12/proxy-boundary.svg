<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">서술-결과 불일치 프록시의 경계</title><desc id="desc">내부 계산은 관찰하지 않음. D는 설명과 답이 같지만 오답. 불일치 없음은 faithfulness 증거가 아님.</desc><rect width="1200" height="430" rx="18" fill="#f5f6f8"/><g font-family="system-ui,sans-serif" fill="#18242e"><text x="48" y="62" font-size="30" font-weight="700">서술-결과 불일치 프록시의 경계</text><rect x="48" y="110" width="350" height="195" rx="12" fill="#dfe9f2"/><text x="68" y="150" font-size="23" font-weight="700">작성 설명</text><text x="68" y="201" font-size="20">A/B/C/D: 2 / 3 / 2 / 3</text><text x="68" y="253" font-size="17">숫자 주장을 제공한 교육 예시</text><rect x="418" y="110" width="350" height="195" rx="12" fill="#e5ede3"/><text x="438" y="150" font-size="23" font-weight="700">숫자 비교</text><text x="438" y="201" font-size="20">설명 수 != 답 수</text><text x="438" y="253" font-size="17">B와 C만 불일치 표시</text><rect x="788" y="110" width="350" height="195" rx="12" fill="#f1e5d5"/><text x="808" y="150" font-size="23" font-weight="700">최종 답</text><text x="808" y="201" font-size="20">A/B/C/D: 2 / 2 / 3 / 3</text><text x="808" y="253" font-size="17">정답 2와의 일치는 별도 검사</text><text x="48" y="355" font-size="18">내부 계산은 관찰하지 않음.</text><text x="48" y="385" font-size="18">D는 설명과 답이 같지만 오답. 불일치 없음은 faithfulness 증거가 아님.</text></g></svg>
