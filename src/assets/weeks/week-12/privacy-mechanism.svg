<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">노이즈 scale과 유효 epsilon</title><desc id="desc">이상적 Laplace 메커니즘의 매개변수. 공개 고정 seed 교육 실험은 실제 DP 공개 보장을 제공하지 않음.</desc><rect width="1200" height="430" rx="18" fill="#f5f6f8"/><g font-family="system-ui,sans-serif" fill="#18242e"><text x="48" y="62" font-size="30" font-weight="700">노이즈 scale과 유효 epsilon</text><rect x="48" y="110" width="350" height="195" rx="12" fill="#dfe9f2"/><text x="68" y="150" font-size="23" font-weight="700">기여 제한</text><text x="68" y="201" font-size="20">참여 레코드 하나: 0 또는 1</text><text x="68" y="253" font-size="17">추가·제거 인접 관계, Δf = 1</text><rect x="418" y="110" width="350" height="195" rx="12" fill="#e5ede3"/><text x="438" y="150" font-size="23" font-weight="700">기준 설정</text><text x="438" y="201" font-size="20">b = 1 / 1 = 1</text><text x="438" y="253" font-size="17">기준 epsilon = 1, multiplier = 1</text><rect x="788" y="110" width="350" height="195" rx="12" fill="#f1e5d5"/><text x="808" y="150" font-size="23" font-weight="700">노이즈 두 배</text><text x="808" y="201" font-size="20">b = 2, epsilon = 1 / 2</text><text x="808" y="253" font-size="17">multiplier = 2이면 epsilon = 0.5</text><text x="48" y="355" font-size="18">이상적 Laplace 메커니즘의 매개변수.</text><text x="48" y="385" font-size="18">공개 고정 seed 교육 실험은 실제 DP 공개 보장을 제공하지 않음.</text></g></svg>
