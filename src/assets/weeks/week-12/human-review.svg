<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">출력 경계와 사람의 실질적 감독</title><desc id="desc">지역 정책의 환경·수용성은 사실 요약만으로 정답을 확정할 수 없는 판단. 책임 주체와 절차를 명시.</desc><rect width="1200" height="430" rx="18" fill="#f5f6f8"/><g font-family="system-ui,sans-serif" fill="#18242e"><text x="48" y="62" font-size="30" font-weight="700">출력 경계와 사람의 실질적 감독</text><rect x="48" y="110" width="350" height="195" rx="12" fill="#dfe9f2"/><text x="68" y="150" font-size="23" font-weight="700">허용 범위</text><text x="68" y="201" font-size="20">공개 문서 안내</text><text x="68" y="253" font-size="17">출처·시점·빠진 조건 표시</text><rect x="418" y="110" width="350" height="195" rx="12" fill="#e5ede3"/><text x="438" y="150" font-size="23" font-weight="700">보류 조건</text><text x="438" y="201" font-size="20">안전·자격·권리 최종 판정</text><text x="438" y="253" font-size="17">자동 단정·외부 전달 보류</text><rect x="788" y="110" width="350" height="195" rx="12" fill="#f1e5d5"/><text x="808" y="150" font-size="23" font-weight="700">사람 확인</text><text x="808" y="201" font-size="20">근거 검토 후 결정</text><text x="808" y="253" font-size="17">수정·거부·중단·이의 제기</text><text x="48" y="355" font-size="18">지역 정책의 환경·수용성은 사실 요약만으로 정답을 확정할 수 없는 판단.</text><text x="48" y="385" font-size="18">책임 주체와 절차를 명시.</text></g></svg>
