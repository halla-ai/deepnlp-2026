<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">설명을 읽는 세 가지 질문</title><desc id="desc">어느 한 칸의 통과도 다른 칸의 통과를 보장하지 않음. 내부 충실성은 이번 실습에서 미측정.</desc><rect width="1200" height="430" rx="18" fill="#f5f6f8"/><g font-family="system-ui,sans-serif" fill="#18242e"><text x="48" y="62" font-size="30" font-weight="700">설명을 읽는 세 가지 질문</text><rect x="48" y="110" width="350" height="195" rx="12" fill="#dfe9f2"/><text x="68" y="150" font-size="23" font-weight="700">추론 정확성</text><text x="68" y="201" font-size="20">출력 설명의 사실·논리</text><text x="68" y="253" font-size="17">2라고 설명한 근거가 맞는가</text><rect x="418" y="110" width="350" height="195" rx="12" fill="#e5ede3"/><text x="438" y="150" font-size="23" font-weight="700">답 정확성</text><text x="438" y="201" font-size="20">마지막 답과 외부 정답</text><text x="438" y="253" font-size="17">답이 기준 2와 일치하는가</text><rect x="788" y="110" width="350" height="195" rx="12" fill="#f1e5d5"/><text x="808" y="150" font-size="23" font-weight="700">내부 충실성</text><text x="808" y="201" font-size="20">실제 계산과 설명의 관계</text><text x="808" y="253" font-size="17">출력 두 개만으로 확인 불가</text><text x="48" y="355" font-size="18">어느 한 칸의 통과도 다른 칸의 통과를 보장하지 않음.</text><text x="48" y="385" font-size="18">내부 충실성은 이번 실습에서 미측정.</text></g></svg>
